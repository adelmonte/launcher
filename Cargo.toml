[package]
name = "launcher"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "An application launcher for Wayland status bars"

[[bin]]
name = "launcher"
path = "src/main.rs"

[dependencies]
gui-toolkit = { git = "https://github.com/adelmonte/gui-toolkit", tag = "v0.1.0" }
serde_json = "1"
libc = "0.2"
signal-hook = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
